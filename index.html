<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include the html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Include qrcode.js library for generating QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>QR Code Scanner</h1>
        </header>

        <main>
            <div class="scanner-wrapper">
                <div class="method-select-group">
                    <label for="method-select">Scan Method:</label>
                    <select id="method-select" class="select-field">
                        <option value="file">Upload Image File</option>
                        <option value="camera" selected>Camera Scan</option>
                    </select>
                </div>

                <div id="camera-section" class="scan-section">
                    <div class="camera-controls">
                        <div class="camera-select-group">
                            <label for="camera-select">Camera:</label>
                            <select id="camera-select" class="select-field">
                                <option value="environment">Back Camera (Environment)</option>
                                <option value="user">Front Camera (User)</option>
                            </select>
                        </div>
                        <button id="switch-camera-btn" class="btn secondary-btn" type="button">Switch Camera</button>
                    </div>
                    <div id="reader" class="scanner-container"></div>
                </div>

                <div id="file-section" class="scan-section hidden">
                    <div class="file-input-group">
                        <label for="qr-input-file" class="file-input-label">Choose QR Code Image:</label>
                        <input type="file" id="qr-input-file" accept="image/*" class="input-field file-input" />
                    </div>
                    <div id="file-scanner-preview" class="file-preview-container">
                        <p class="placeholder-text">Select an image file above to scan for QR code</p>
                    </div>
                </div>
            </div>
            
            <div class="result-container">
                <h2>Scan Result</h2>
                <div id="result" class="result-box">
                    <p class="placeholder-text">Waiting for a scan...</p>
                </div>
                <div class="actions">
                    <button id="copy-btn" class="btn" disabled>Copy</button>
                    <button id="clear-btn" class="btn" disabled>Clear</button>
                </div>
            </div>

            <div class="generator-container">
                <h2>Generate QR Code</h2>
                <div class="generator-input-group">
                    <input type="url" id="link-input" placeholder="Enter link or text (e.g. https://example.com)" class="input-field" />
                    <button id="generate-btn" class="btn primary-btn">Generate QR</button>
                </div>
                <div id="qrcode-display" class="qrcode-display-box">
                    <p class="placeholder-text">Generated QR code will appear here</p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by html5-qrcode</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
