<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include the html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Include qrcode.js library for generating QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" type="text/javascript"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>QR Code Scanner</h1>
        </header>

        <main>
            <div id="reader" class="scanner-container"></div>
            
            <div class="result-container">
                <h2>Scan Result</h2>
                <div id="result" class="result-box">
                    <p class="placeholder-text">Waiting for a scan...</p>
                </div>
                <div class="actions">
                    <button id="copy-btn" class="btn" disabled>Copy</button>
                    <button id="clear-btn" class="btn" disabled>Clear</button>
                </div>
            </div>

            <div class="generator-container">
                <h2>Generate QR Code</h2>
                <div class="generator-input-group">
                    <input type="url" id="link-input" placeholder="Enter link or text (e.g. https://example.com)" class="input-field" />
                    <button id="generate-btn" class="btn primary-btn">Generate QR</button>
                </div>
                <div id="qrcode-display" class="qrcode-display-box">
                    <p class="placeholder-text">Generated QR code will appear here</p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by html5-qrcode</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
